<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="DocketStamp document preparation and USPS certified mail schematic">
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </linearGradient>
    <pattern id="ds-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7dd3fc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#ds-bg)"/>
  <rect width="800" height="450" fill="url(#ds-grid)"/>

  <circle cx="210" cy="225" r="160" fill="#7dd3fc" fill-opacity="0.06"/>
  <circle cx="590" cy="220" r="150" fill="#f59e0b" fill-opacity="0.06"/>

  <text x="64" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7dd3fc" letter-spacing="1.5">DETERMINISTIC DISPATCH PIPELINE</text>
  <line x1="64" y1="68" x2="736" y2="68" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Left: Frozen Document Card -->
  <g transform="translate(76, 98)">
    <rect width="276" height="292" rx="14" fill="#0f172a" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="20" y="20" width="236" height="30" rx="6" fill="#1e293b"/>
    <circle cx="38" cy="35" r="5" fill="#f59e0b"/>
    <text x="52" y="40" font-family="ui-monospace, monospace" font-size="12" fill="#e2e8f0">NOTICE_FROZEN_V1.PDF</text>

    <rect x="24" y="70" width="140" height="10" rx="3" fill="#7dd3fc" fill-opacity="0.5"/>
    <rect x="24" y="92" width="224" height="7" rx="3" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="24" y="108" width="210" height="7" rx="3" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="24" y="124" width="228" height="7" rx="3" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="24" y="140" width="180" height="7" rx="3" fill="#94a3b8" fill-opacity="0.4"/>

    <rect x="24" y="168" width="228" height="58" rx="8" fill="#070b14" fill-opacity="0.75" stroke="#7dd3fc" stroke-opacity="0.2"/>
    <text x="38" y="191" font-family="ui-monospace, monospace" font-size="11" fill="#7dd3fc">CASS ADDRESS VERIFIED</text>
    <text x="38" y="211" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">LOCKED BEFORE PAYMENT</text>

    <g transform="translate(140, 240)">
      <rect width="112" height="32" rx="6" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="56" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#fbbf24">VERIFIED</text>
    </g>
  </g>

  <!-- Connector arrow -->
  <g stroke="#7dd3fc" stroke-width="2" fill="none">
    <path d="M 366 215 L 434 215" stroke-dasharray="6 4"/>
    <polygon points="434,209 448,215 434,221" fill="#7dd3fc" stroke="none"/>
  </g>
  <text x="404" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">USPS</text>

  <!-- Right: Certified Mail Envelope & Tracking -->
  <g transform="translate(460, 118)">
    <rect width="272" height="176" rx="14" fill="#131d33" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="206" y="18" width="46" height="54" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="229" y="42" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#fbbf24">USPS</text>
    <text x="229" y="57" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#f1f5f9">CERT</text>

    <rect x="24" y="34" width="110" height="9" rx="3" fill="#e2e8f0" fill-opacity="0.65"/>
    <rect x="24" y="52" width="145" height="7" rx="3" fill="#94a3b8" fill-opacity="0.45"/>
    <rect x="24" y="68" width="125" height="7" rx="3" fill="#94a3b8" fill-opacity="0.45"/>

    <rect x="24" y="106" width="224" height="48" rx="6" fill="#070b14" stroke="#7dd3fc" stroke-opacity="0.28"/>
    <g fill="#7dd3fc" fill-opacity="0.85">
      <rect x="38" y="116" width="3" height="20"/>
      <rect x="44" y="116" width="1" height="20"/>
      <rect x="48" y="116" width="4" height="20"/>
      <rect x="55" y="116" width="2" height="20"/>
      <rect x="60" y="116" width="1" height="20"/>
      <rect x="64" y="116" width="5" height="20"/>
      <rect x="72" y="116" width="2" height="20"/>
      <rect x="77" y="116" width="3" height="20"/>
      <rect x="83" y="116" width="1" height="20"/>
      <rect x="87" y="116" width="4" height="20"/>
      <rect x="94" y="116" width="2" height="20"/>
      <rect x="99" y="116" width="3" height="20"/>
      <rect x="105" y="116" width="1" height="20"/>
      <rect x="109" y="116" width="5" height="20"/>
      <rect x="117" y="116" width="2" height="20"/>
      <rect x="122" y="116" width="3" height="20"/>
      <rect x="128" y="116" width="4" height="20"/>
      <rect x="135" y="116" width="1" height="20"/>
      <rect x="139" y="116" width="3" height="20"/>
    </g>
    <text x="154" y="131" font-family="ui-monospace, monospace" font-size="10" fill="#cbd5e1">ERR RECEIPT</text>
    <text x="38" y="147" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">9407 1118 9956 • CHAIN OF CUSTODY</text>
  </g>

  <g transform="translate(460, 314)" font-family="ui-monospace, monospace" font-size="11">
    <rect width="128" height="32" rx="16" fill="#0f172a" stroke="#7dd3fc" stroke-opacity="0.35"/>
    <text x="64" y="20" text-anchor="middle" fill="#7dd3fc">FIRST-CLASS</text>

    <rect x="140" width="132" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="206" y="20" text-anchor="middle" fill="#fbbf24">CERTIFIED + ERR</text>
  </g>
</svg>
