<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="DocketStamp document preparation and USPS certified mail schematic">
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="55%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ds-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4adfff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ds-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="ds-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#4adfff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#ds-bg)"/>
  <rect width="800" height="450" fill="url(#ds-grid)"/>

  <!-- Ambient glow -->
  <circle cx="210" cy="225" r="160" fill="#4adfff" fill-opacity="0.08"/>
  <circle cx="590" cy="220" r="150" fill="#ff6b4a" fill-opacity="0.08"/>

  <!-- Top pipeline label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4adfff" letter-spacing="1.5">
    <text x="64" y="54">DETERMINISTIC DISPATCH PIPELINE</text>
  </g>
  <line x1="64" y1="68" x2="736" y2="68" stroke="#4adfff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Left: Frozen Document Card -->
  <g transform="translate(76, 98)">
    <rect width="276" height="292" rx="14" fill="#131932" stroke="#4adfff" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="20" y="20" width="236" height="30" rx="6" fill="#1e294b"/>
    <circle cx="38" cy="35" r="5" fill="#ff6b4a"/>
    <text x="52" y="40" font-family="ui-monospace, monospace" font-size="12" fill="#e2e8f0">NOTICE_FROZEN_V1.PDF</text>

    <!-- Document lines -->
    <rect x="24" y="70" width="140" height="10" rx="3" fill="#4adfff" fill-opacity="0.55"/>
    <rect x="24" y="92" width="224" height="7" rx="3" fill="#94a3b8" fill-opacity="0.45"/>
    <rect x="24" y="108" width="210" height="7" rx="3" fill="#94a3b8" fill-opacity="0.45"/>
    <rect x="24" y="124" width="228" height="7" rx="3" fill="#94a3b8" fill-opacity="0.45"/>
    <rect x="24" y="140" width="180" height="7" rx="3" fill="#94a3b8" fill-opacity="0.45"/>

    <rect x="24" y="168" width="228" height="58" rx="8" fill="#0b0d17" fill-opacity="0.7" stroke="#4adfff" stroke-opacity="0.25"/>
    <text x="38" y="191" font-family="ui-monospace, monospace" font-size="11" fill="#4adfff">CASS ADDRESS VERIFIED</text>
    <text x="38" y="211" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">SHA-256 LOCKED PRE-PAY</text>

    <!-- Stamp badge -->
    <g transform="translate(140, 240)">
      <rect width="112" height="32" rx="6" fill="#ff6b4a" fill-opacity="0.16" stroke="#ff6b4a" stroke-width="1.5"/>
      <text x="56" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#ff6b4a">VERIFIED</text>
    </g>
  </g>

  <!-- Connector arrows -->
  <g stroke="#4adfff" stroke-width="2" fill="none">
    <path d="M 366 215 L 434 215" stroke-dasharray="6 4"/>
    <polygon points="434,209 448,215 434,221" fill="#4adfff" stroke="none"/>
  </g>
  <text x="404" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">USPS</text>

  <!-- Right: Certified Mail Envelope & Tracking -->
  <g transform="translate(460, 118)">
    <rect width="272" height="176" rx="14" fill="#171f3e" stroke="#ff6b4a" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- Postage Stamp -->
    <rect x="206" y="18" width="46" height="54" rx="4" fill="url(#ds-orange)" fill-opacity="0.2" stroke="#ff6b4a" stroke-width="1.5"/>
    <text x="229" y="42" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ff6b4a">USPS</text>
    <text x="229" y="57" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#f8fafc">CERT</text>

    <!-- Recipient lines -->
    <rect x="24" y="34" width="110" height="9" rx="3" fill="#e2e8f0" fill-opacity="0.7"/>
    <rect x="24" y="52" width="145" height="7" rx="3" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="24" y="68" width="125" height="7" rx="3" fill="#94a3b8" fill-opacity="0.5"/>

    <!-- Certified Mail Barcode strip -->
    <rect x="24" y="106" width="224" height="48" rx="6" fill="#0b0d17" stroke="#4adfff" stroke-opacity="0.35"/>
    <g fill="#4adfff" fill-opacity="0.85">
      <rect x="38" y="116" width="3" height="20"/>
      <rect x="44" y="116" width="1" height="20"/>
      <rect x="48" y="116" width="4" height="20"/>
      <rect x="55" y="116" width="2" height="20"/>
      <rect x="60" y="116" width="1" height="20"/>
      <rect x="64" y="116" width="5" height="20"/>
      <rect x="72" y="116" width="2" height="20"/>
      <rect x="77" y="116" width="3" height="20"/>
      <rect x="83" y="116" width="1" height="20"/>
      <rect x="87" y="116" width="4" height="20"/>
      <rect x="94" y="116" width="2" height="20"/>
      <rect x="99" y="116" width="3" height="20"/>
      <rect x="105" y="116" width="1" height="20"/>
      <rect x="109" y="116" width="5" height="20"/>
      <rect x="117" y="116" width="2" height="20"/>
      <rect x="122" y="116" width="3" height="20"/>
      <rect x="128" y="116" width="4" height="20"/>
      <rect x="135" y="116" width="1" height="20"/>
      <rect x="139" y="116" width="3" height="20"/>
    </g>
    <text x="154" y="131" font-family="ui-monospace, monospace" font-size="10" fill="#cbd5e1">ERR RECEIPT</text>
    <text x="38" y="147" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">9407 1118 9956 • CHAIN OF CUSTODY</text>
  </g>

  <!-- Bottom status pills -->
  <g transform="translate(460, 314)" font-family="ui-monospace, monospace" font-size="11">
    <rect width="128" height="32" rx="16" fill="#131932" stroke="#4adfff" stroke-opacity="0.45"/>
    <text x="64" y="20" text-anchor="middle" fill="#4adfff">FIRST-CLASS</text>

    <rect x="140" width="132" height="32" rx="16" fill="#131932" stroke="#ff6b4a" stroke-opacity="0.55"/>
    <text x="206" y="20" text-anchor="middle" fill="#ff6b4a">CERTIFIED + ERR</text>
  </g>
</svg>
