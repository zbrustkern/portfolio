<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="SendMyNotes and Aster and Blanche Press real pen-on-paper greeting card studio">
  <defs>
    <linearGradient id="smn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="60%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="smn-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f3ece0"/>
    </linearGradient>
    <linearGradient id="smn-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#smn-bg)"/>

  <g fill="#e2e8f0" fill-opacity="0.35">
    <circle cx="90" cy="80" r="1.5"/>
    <circle cx="150" cy="360" r="2"/>
    <circle cx="690" cy="95" r="2"/>
    <circle cx="725" cy="330" r="1.5"/>
    <circle cx="420" cy="48" r="1.5"/>
  </g>

  <circle cx="300" cy="235" r="170" fill="#f59e0b" fill-opacity="0.06"/>
  <circle cx="550" cy="215" r="160" fill="#7dd3fc" fill-opacity="0.06"/>

  <!-- Envelope -->
  <g transform="translate(360, 125) rotate(6)">
    <rect width="310" height="215" rx="10" fill="#162138" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M 10 10 L 155 112 L 300 10" fill="none" stroke="#7dd3fc" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="155" cy="112" r="22" fill="url(#smn-accent)"/>
    <text x="155" y="117" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#070b14">A&amp;B</text>
    <rect x="242" y="24" width="46" height="54" rx="4" fill="#070b14" fill-opacity="0.55" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="265" y="49" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#fbbf24">FIRST</text>
    <text x="265" y="63" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#f1f5f9">CLASS</text>
  </g>

  <!-- Card -->
  <g transform="translate(115, 78) rotate(-3)">
    <rect x="6" y="10" width="330" height="278" rx="8" fill="#000000" fill-opacity="0.38"/>
    <rect width="330" height="278" rx="8" fill="url(#smn-paper)" stroke="#e2d7c5" stroke-width="1.5"/>

    <text x="28" y="38" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#475569">ASTER &amp; BLANCHE PRESS</text>
    <line x1="28" y1="50" x2="302" y2="50" stroke="#cbd5e1" stroke-width="1"/>

    <path d="M 32 88 C 60 72, 95 98, 128 84 C 155 72, 185 95, 222 83 C 245 76, 268 88, 285 82" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 32 122 C 72 110, 108 134, 152 118 C 192 104, 232 130, 278 116" fill="none" stroke="#1e293b" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M 32 156 C 68 144, 114 166, 158 152 C 190 142, 225 162, 255 152" fill="none" stroke="#1e293b" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M 32 190 C 66 178, 102 198, 146 186 C 172 179, 198 190, 212 186" fill="none" stroke="#1e293b" stroke-width="2.1" stroke-linecap="round"/>

    <path d="M 185 232 C 202 214, 218 242, 236 226 C 250 214, 262 235, 286 224" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>

    <g transform="translate(274, 186) rotate(32)">
      <path d="M 14 0 L 28 32 L 18 44 L 10 44 L 0 32 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="14" y1="0" x2="14" y2="24" stroke="#7dd3fc" stroke-width="1.5"/>
      <circle cx="14" cy="26" r="2.5" fill="#7dd3fc"/>
    </g>

    <text x="28" y="260" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">REAL PEN &amp; INK · CUSTOM CARD</text>
  </g>

  <g transform="translate(465, 370)" font-family="ui-monospace, monospace" font-size="11">
    <rect width="128" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="64" y="19" text-anchor="middle" fill="#fbbf24">REAL PEN INK</text>

    <rect x="140" width="135" height="30" rx="15" fill="#0f172a" stroke="#7dd3fc" stroke-opacity="0.35"/>
    <text x="207" y="19" text-anchor="middle" fill="#7dd3fc">MAILED FOR YOU</text>
  </g>
</svg>
